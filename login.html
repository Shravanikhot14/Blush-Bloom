    <!-- Login Section -->
    <section class="py-5" style="background: var(--gradient-cream); min-height: calc(100vh - 200px);">
        <div class="container">
            <div class="row justify-content-center align-items-center">
                <div class="col-lg-5 col-md-7">
                    <div class="card border-0 shadow-lg rounded-custom">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <i class="bi bi-flower1 display-4 text-primary mb-3"></i>
                                <h2>Welcome Back</h2>
                                <p class="text-muted">Login to your account</p>
                            </div>
                            
                            <form id="login-form" novalidate>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-envelope"></i>
                                        </span>
                                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                                    </div>
                                    <div class="invalid-feedback" id="email-error"></div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-lock"></i>
                                        </span>
                                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                                        <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                                            <i class="bi bi-eye" id="password-icon"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback" id="password-error"></div>
                                </div>
                                
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="remember-me">
                                    <label class="form-check-label" for="remember-me">Remember me</label>
                                </div>
                                
                                <div class="mb-4">
                                    <a href="#" class="text-primary text-decoration-none">Forgot Password?</a>
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100 btn-lg">Login</button>
                            </form>
                            
                            <div class="text-center mt-4">
                                <p class="mb-0">Don't have an account? <a href="register.html" class="text-primary text-decoration-none fw-bold">Register</a></p>
                            </div>
                            
                            <div class="mt-4 pt-4 border-top">
                                <p class="text-center text-muted small mb-3">Or login with</p>
                                <div class="d-flex gap-2 justify-content-center">
                                    <button class="btn btn-outline-secondary flex-grow-1">
                                        <i class="bi bi-google me-2"></i>Google
                                    </button>
                                    <button class="btn btn-outline-secondary flex-grow-1">
                                        <i class="bi bi-facebook me-2"></i>Facebook
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    

    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
    <!-- Auth JavaScript -->
    <script src="js/auth.js"></script>
    
    <!-- Page-specific JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is already logged in
            if (isLoggedIn()) {
                showNotification('You are already logged in!', 'info');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                return;
            }

            initLoginForm();
        });

        function initLoginForm() {
            const loginForm = document.getElementById('login-form');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('password-icon');

            // Toggle password visibility
            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                passwordIcon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
            });

            // Handle form submission
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                handleLogin();
            });
        }

        function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            // Clear previous errors
            clearErrors();

            // Validate email
            if (!email) {
                showError('email', 'Email is required');
                return;
            }

            if (!validateEmail(email)) {
                showError('email', 'Please enter a valid email address');
                return;
            }

            // Validate password
            if (!password) {
                showError('password', 'Password is required');
                return;
            }

            if (password.length < 6) {
                showError('password', 'Password must be at least 6 characters');
                return;
            }

            // Attempt login
            const result = loginUser(email, password, rememberMe);

            if (result.success) {
                showNotification(result.message, 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showError('password', result.message);
                showNotification(result.message, 'danger');
            }
        }

        function showError(fieldId, message) {
            const input = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + '-error');
            
            input.classList.add('is-invalid');
            errorDiv.textContent = message;
        }

        function clearErrors() {
            const inputs = document.querySelectorAll('.form-control');
            const errorDivs = document.querySelectorAll('.invalid-feedback');
            
            inputs.forEach(input => input.classList.remove('is-invalid'));
            errorDivs.forEach(div => div.textContent = '');
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification position-fixed top-0 end-0 m-3 p-3 bg-${type} text-white rounded shadow`;
            notification.style.zIndex = '9999';
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
